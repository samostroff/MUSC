<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Player 4: Rhythm Activities</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SR0VG72M7B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-SR0VG72M7B');
  </script>

  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; }
    h1 { font-size: 1.5rem; }
    ul { list-style: none; padding: 0; }
    li { margin: 0.3rem 0; }
    button { margin-left: 0.5rem; }
    .current { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Rhythm Activities</h1>

  <ul id="track-list"></ul>

  <audio id="audio" controls style="width: 100%; margin-top: 1rem;">
    Your browser does not support the audio element.
  </audio>

  <script>
  // 1) DEFINE YOUR TRACKS HERE
  const tracks = [
    {
      id: 'VO1',
      title: 'How To Perform This Activity: Part 1',
      url: 'https://samostroff.github.io/MUSC-Audio-Player/audio/VO1.mp3'
    },
    {
      id: 'VO2',
      title: 'How To Perform This Activity: Part 2',
      url: 'https://samostroff.github.io/MUSC-Audio-Player/audio/VO2.mp3'
    },
    {
      id: 'track1',
      title: 'Rhythm 1',
      url: 'https://samostroff.github.io/MUSC-Audio-Player/audio/Rhythm1.mp3'
    },
    {
      id: 'track2',
      title: 'Rhythm 2',
      url: 'https://samostroff.github.io/MUSC-Audio-Player/audio/Rhythm2.mp3'
    },
    {
      id: 'track3',
      title: 'Rhythm 3',
      url: 'https://samostroff.github.io/MUSC-Audio-Player/audio/Rhythm3.mp3'
    },
    {
      id: 'VO3',
      title: 'How To Perform This Activity: Part 3',
      url: 'https://samostroff.github.io/MUSC-Audio-Player/audio/VO3.mp3'
    },
    {
      id: 'track4',
      title: 'Free Rhythm',
      url: 'https://samostroff.github.io/MUSC-Audio-Player/audio/Rhythm0.mp3'
    }
  ];

  const audio = document.getElementById('audio');
  const trackList = document.getElementById('track-list');

  // Debug logger (you can remove later)
  audio.addEventListener('error', () => {
    const err = audio.error;
    console.log('Audio error:', err ? err.code : 'unknown');
  });

  let currentTrackIndex = 0;
  let progressMilestonesSent = new Set(); // e.g., 25, 50, 75

  // NEW: listening tracking state
  let lastReportedTime = 0;    // last second we sent to GA
  let lastKnownTime = 0;       // latest currentTime we saw

  // 2) RENDER TRACK LIST
  function renderTrackList() {
    trackList.innerHTML = '';
    tracks.forEach((track, index) => {
      const li = document.createElement('li');
      li.textContent = track.title;
      if (index === currentTrackIndex) li.classList.add('current');

      const playBtn = document.createElement('button');
      playBtn.textContent = 'Play';
      playBtn.addEventListener('click', () => {
        playTrack(index);
      });

      li.appendChild(playBtn);
      trackList.appendChild(li);
    });
  }

  function updateCurrentTrackHighlight() {
    [...trackList.children].forEach((li, index) => {
      li.classList.toggle('current', index === currentTrackIndex);
    });
  }

  // 3) TRACKING HELPERS
  function sendGAEvent(eventName, params) {
    if (typeof gtag === 'function') {
      gtag('event', eventName, params);
    }
  }

  function getCurrentTrack() {
    return tracks[currentTrackIndex];
  }

  function sendTrackStartEvent(track) {
  console.log('DEBUG track_start fired for', track.id, track.title);  // temporary log
  sendGAEvent('track_start', {
    track_id: track.id,
    track_name: track.title
  });
}


  // OLD: milestone-style progress (25/50/75) — keeping it
  function sendTrackProgressMilestoneEvent(track, percent) {
    sendGAEvent('track_progress_milestone', {
      track_id: track.id,
      track_name: track.title,
      progress_percent: percent
    });
  }

  function sendTrackCompleteEvent(track) {
    sendGAEvent('track_complete', {
      track_id: track.id,
      track_name: track.title
    });
  }

  // NEW: continuous progress (seconds + percent)
  function sendTrackListeningProgress(duration, isEnded = false) {
    const track = getCurrentTrack();
    if (!track || !duration || isNaN(duration)) return;

    const listenedSeconds = Math.round(lastKnownTime);
    const percent = Math.max(
      0,
      Math.min(100, Math.round((listenedSeconds / duration) * 100))
    );

    sendGAEvent('track_progress', {
      track_id: track.id,
      track_name: track.title,
      listened_seconds: listenedSeconds,
      listened_percent: percent,
      ended: isEnded
    });

    // Optional: explicit "complete" when finished
    if (isEnded || percent >= 90) {
      sendTrackCompleteEvent(track);
    }
  }

  // 4) AUDIO CONTROL + GA LOGIC
  function playTrack(index) {
    currentTrackIndex = index;
    const track = tracks[currentTrackIndex];
    progressMilestonesSent.clear();
    lastReportedTime = 0;
    lastKnownTime = 0;

    audio.pause();
    audio.currentTime = 0;

    audio.src = track.url;
    audio.load();

    const onCanPlay = () => {
      audio.removeEventListener('canplay', onCanPlay);
      audio.play().catch(err => {
        console.warn('Audio play error:', err);
      });
    };
    audio.addEventListener('canplay', onCanPlay);

    updateCurrentTrackHighlight();
    sendTrackStartEvent(track);
  }

  // On timeupdate, check progress
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration || isNaN(audio.duration)) return;

    const track = tracks[currentTrackIndex];
    const percent = (audio.currentTime / audio.duration) * 100;
    lastKnownTime = audio.currentTime;

    // 1) Milestones at 25/50/75 (existing behavior, renamed)
    [25, 50, 75].forEach(milestone => {
      if (percent >= milestone && !progressMilestonesSent.has(milestone)) {
        progressMilestonesSent.add(milestone);
        sendTrackProgressMilestoneEvent(track, milestone);
      }
    });

    // 2) NEW: send listening progress every 5 seconds of play
    if (audio.currentTime - lastReportedTime >= 5) {
      lastReportedTime = audio.currentTime;
      sendTrackListeningProgress(audio.duration, false);
    }
  });

  // On pause, send a final progress snapshot for this listening segment
  audio.addEventListener('pause', () => {
    if (!audio.duration || isNaN(audio.duration)) return;
    lastKnownTime = audio.currentTime;
    sendTrackListeningProgress(audio.duration, false);
  });

  // On ended, send complete progress (and auto-advance)
  audio.addEventListener('ended', () => {
    if (!audio.duration || isNaN(audio.duration)) return;
    lastKnownTime = audio.duration;
    sendTrackListeningProgress(audio.duration, true);

    // Optional: auto-play next track
    if (currentTrackIndex < tracks.length - 1) {
      playTrack(currentTrackIndex + 1);
    }
  });

  // INITIALIZE
  renderTrackList();
  if (tracks.length > 0) {
    audio.src = tracks[0].url;
  }

  // SPACEBAR KEYBOARD TOGGLE
  window.addEventListener('keydown', (event) => {
    const tag = event.target.tagName.toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;

    if (event.code === 'Space' || event.keyCode === 32) {
      event.preventDefault();
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }
  });
</script>

</body>
</html>
